name: release-assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Release workflow run containing the artifacts
        required: true
        type: string
      tag:
        description: Existing version tag for the GitHub release
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          prerelease=""
          case "${RELEASE_TAG}" in *-*) prerelease="--prerelease" ;; esac
          mapfile -d '' assets < <(
            find artifacts -type f \( \
              -name 'codetutor-*.tgz' -o \
              -name 'codetutor-desktop-*.dmg' -o \
              -name 'codetutor-desktop-*.zip' -o \
              -name 'codetutor-desktop-*.exe' -o \
              -name 'codetutor-desktop-*.AppImage' -o \
              -name 'codetutor-desktop-*.deb' -o \
              -name 'codetutor-desktop-*.rpm' \
            \) -print0
          )
          test "${#assets[@]}" -gt 0
          gh release create "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes $prerelease
